<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Finance</title>
    <meta name="description" content="Fidelize clientes e crie novas receitas com Banking As A Service. Tecnologia e segurança bancária integradas de forma simples ao seu negócio." />
    <!-- Preload critical Hero images for LCP -->
    <link rel="preload" as="image" href="herozinha.webp" media="(min-width: 1024px)" fetchpriority="high" />
    <link rel="preload" as="image" href="hero%20mobile.webp" media="(max-width: 1023px)" fetchpriority="high" />
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      .static-logo {
        width: 160px;
        height: 160px;
      }
      @media (min-width: 640px) {
        .static-logo {
          width: 192px;
          height: 192px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Static Initial Loader to prevent blank white screen flash before React mounts -->
    <div id="initial-loader" style="position: fixed; inset: 0; z-index: 10000000; background-color: #ffffff; display: flex; align-items: center; justify-content: center;">
      <img class="static-logo" src="logo asset.png" alt="Asset Logo" style="object-fit: contain; filter: brightness(0); opacity: 1; user-select: none; pointer-events: none;" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
